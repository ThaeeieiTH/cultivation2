name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Add Minecraft repositories
        run: |
          mkdir -p ~/.gradle/init.d
          echo "allprojects { repositories { maven { url = 'https://libraries.minecraft.net/' }; maven { url = 'https://maven.fabricmc.net/' } } }" > ~/.gradle/init.d/repos.gradle
      - run: unzip -o cultivation-mod_v3.zip
      - name: Build
        working-directory: cultivation
        run: |
          gradle build --no-daemon --console=plain > build.log 2>&1 || { grep -B2 -A15 "What went wrong" build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cultivation-mod
          path: cultivation/build/libs/*.jar
